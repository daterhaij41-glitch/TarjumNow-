name: Build TarjumNow Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'TarjumNow-Android-Source.zip'
      - '.github/workflows/build-tarjumnow.yml'

permissions:
  contents: read

env:
  WHISPER_CPP_TAG: v1.9.5

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q TarjumNow-Android-Source.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Download Whisper.cpp
        working-directory: TarjumNow
        run: |
          git clone --depth 1 --recurse-submodules \
            --shallow-submodules \
            --branch "$WHISPER_CPP_TAG" \
            https://github.com/ggml-org/whisper.cpp.git whisper.cpp

          JNI="whisper.cpp/examples/whisper.android/lib/src/main/jni/whisper/jni.c"
          test -f "$JNI"

          grep -q 'params.language = "en";' "$JNI"
          sed -i 's/params.language = "en";/params.language = "tr";/' "$JNI"
          sed -i 's/params.print_realtime = true;/params.print_realtime = false;/' "$JNI"

          grep -q 'params.language = "tr";' "$JNI"

      - name: Run unit tests
        working-directory: TarjumNow
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build APK
        working-directory: TarjumNow
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarjumNow-debug-apk
          path: TarjumNow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
